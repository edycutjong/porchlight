name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── STAGE 1: Code Quality (parallel with Stage 2) ─────────
  quality:
    name: "Stage 1 · Quality"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ${{ github.event_name == 'push' && fromJSON('[20, 22, 24]') || fromJSON('[22]') }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci
      - name: Type check (strict)
        run: npm run typecheck
      - name: Unit tests with coverage
        run: npm run test:coverage

  # ── STAGE 2: Security Gate (parallel with Stage 1) ────────
  secret-scan:
    name: "Stage 2 · Secret Scanning"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  dependency-audit:
    name: "Stage 2 · Dependency Audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - name: npm audit (high + critical)
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: License compliance check
        run: npx license-checker --production --failOn "GPL-3.0;AGPL-3.0" --summary
        continue-on-error: true

  # ── STAGE 3: Build / Smoke Verification ───────────────────
  build:
    name: "Stage 3 · Build & Smoke"
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      # No bundler step — tsx runs TypeScript directly. Smoke-verify the whole
      # arc end-to-end (seed → exit interview → semantic match → win-back) in MOCK.
      - name: Typecheck
        run: npm run typecheck
      - name: Full-arc smoke (headless demo, MOCK mode)
        run: npm run demo

  # ── STAGE 4: E2E Tests (Playwright) ───────────────────────
  e2e:
    name: "Stage 4 · E2E Tests"
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run e2e
      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ── STAGE 5: Performance (advisory) ───────────────────────
  performance:
    name: "Stage 5 · Performance"
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - name: Lighthouse CI
        run: |
          npm install -g @lhci/cli
          lhci autorun
        continue-on-error: true

  # ── STAGE 6: Deploy Gate (main only) ──────────────────────
  deploy-gate:
    name: "Stage 6 · Deploy Gate"
    needs: [build, e2e, performance, secret-scan, dependency-audit]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: All gates passed
        run: |
          echo "🚀 All CI/CD gates passed!"
          echo "  ✅ Stage 1 — Quality (strict typecheck, node:test + coverage)"
          echo "  ✅ Stage 2 — Secret Scanning (TruffleHog) + Dependency Audit"
          echo "  ✅ Stage 3 — Build & full-arc smoke (MOCK)"
          echo "  ✅ Stage 4 — E2E (Playwright)"
          echo "  ✅ Stage 5 — Performance (Lighthouse CI, advisory)"
          echo "  ✅ Stage 6 — Deploy Gate"
          echo "  ➡️  Stage 7 — Fly.io deploy (only when src/, public/, Dockerfile or fly.toml changed)"

  # Releases are handled by the dedicated semantic-release workflow (release.yml),
  # which owns SemVer, CHANGELOG, tags, and GitHub Releases on push to main.

  # ── STAGE 7: Deploy the app to Fly.io (main only, after every gate) ───────
  # pages.yml publishes site/ to porchlight.edycu.dev on its own. This job is what
  # keeps try.porchlight.edycu.dev from silently drifting behind the repo: without
  # it, a push touching src/ or public/ goes green, updates the landing page, and
  # leaves the running app on old code with nothing to warn you.
  deploy-fly:
    name: "Stage 7 · Deploy app to Fly.io"
    needs: [deploy-gate]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: fly-deploy-porchlight
      cancel-in-progress: false # never abort a half-finished machine rollout
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # need the parent commit to diff against

      - name: Does this push actually touch the app?
        id: changed
        run: |
          if git diff --name-only HEAD^ HEAD \
            | grep -qE '^(src/|public/|Dockerfile|fly\.toml|package\.json|package-lock\.json)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "App files changed — deploying."
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "Docs/site only — skipping the Fly deploy."
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.changed.outputs.app == 'true'

      - name: Deploy
        if: steps.changed.outputs.app == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --app porchlight-demo

      - name: Verify the deployed app is actually serving
        if: steps.changed.outputs.app == 'true'
        run: |
          for i in $(seq 1 10); do
            body=$(curl -fsS --max-time 20 https://try.porchlight.edycu.dev/healthz) && break
            echo "attempt $i: not ready yet"; sleep 10
          done
          if [ -z "${body:-}" ]; then
            echo "::error::Deploy finished but /healthz never responded."
            exit 1
          fi
          echo "$body"
          # LIVE proves the Mind credentials reached the machine. MOCK would mean the app
          # is up but running the keyword stand-in — worse than being down, because the
          # public demo would silently stop being real.
          echo "$body" | grep -q '"mode":"LIVE"' || {
            echo "::error::App is serving in MOCK mode — the Fly secrets are missing."
            exit 1
          }
          echo "$body" | grep -q '"ok":true' || exit 1
          # Informational only: semantic-release bumps package.json in a [skip ci] commit
          # AFTER this job, so the served version legitimately trails by one release.
          echo "repo package.json version: $(node -p "require('./package.json').version")"
