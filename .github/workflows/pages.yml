name: Deploy site to GitHub Pages

# Publishes the static marketing site (landing + pitch deck) in `site/` to GitHub Pages.
# NOTE: GitHub Pages serves a PRIVATE repo only on paid plans. While this repo is private
# the deploy step will error; once the repo is public (Settings → Pages → Source:
# "GitHub Actions"), pushes that touch `site/` — or a manual run — deploy automatically.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy static site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site/ artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
