<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Porchlight — a hanging porch lantern glowing warm amber in the night, its light falling on a member coming home">
  <!-- 🏮 PORCHLIGHT mark · "a porch light left on, guiding the right members home"
       Colors use custom-property fallbacks, var(token, #hex): standalone rasterization gets the hex,
       embedding in a page that loads _tokens.css lets the brand retune live. -->
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="116"/>
    </clipPath>

    <!-- warm porch-glow halo -->
    <radialGradient id="glow">
      <stop offset="0%"  stop-color="var(--primary, #ffcf6b)" stop-opacity="0.55"/>
      <stop offset="38%" stop-color="var(--primary, #ffcf6b)" stop-opacity="0.26"/>
      <stop offset="70%" stop-color="var(--primary, #ffcf6b)" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="var(--primary, #ffcf6b)" stop-opacity="0"/>
    </radialGradient>

    <!-- ambient atmosphere: warm upper-left, a green whisper lower-right -->
    <radialGradient id="ambientWarm">
      <stop offset="0%" stop-color="var(--primary, #ffcf6b)" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="var(--primary, #ffcf6b)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientGreen">
      <stop offset="0%" stop-color="var(--accent, #69d38a)" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="var(--accent, #69d38a)" stop-opacity="0"/>
    </radialGradient>

    <!-- lantern glass: lit from the core, deepening toward the base -->
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#fff3d2"/>
      <stop offset="45%" stop-color="var(--primary, #ffcf6b)"/>
      <stop offset="100%" stop-color="#e89f45"/>
    </linearGradient>

    <!-- the filament — near-white heart of the light -->
    <radialGradient id="core">
      <stop offset="0%"  stop-color="#fffdf4"/>
      <stop offset="55%" stop-color="#fff3d2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff3d2" stop-opacity="0"/>
    </radialGradient>

    <!-- toon flame: warm body (bright base), soft-gold inner, white tongue -->
    <linearGradient id="flameBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffe6a3"/>
      <stop offset="45%" stop-color="var(--primary, #ffcf6b)"/>
      <stop offset="100%" stop-color="#f0992e"/>
    </linearGradient>
    <linearGradient id="flameCore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#fff7df"/>
      <stop offset="60%" stop-color="#fff0c4"/>
      <stop offset="100%" stop-color="#ffdf8f"/>
    </linearGradient>

    <!-- light cone falling to the porch floor -->
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="var(--primary, #ffcf6b)" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="var(--primary, #ffcf6b)" stop-opacity="0"/>
    </linearGradient>

    <!-- homecoming-green halo for the returning member -->
    <radialGradient id="dotGlow">
      <stop offset="0%"  stop-color="var(--accent, #69d38a)" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="var(--accent, #69d38a)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- deep navy night -->
    <rect width="512" height="512" fill="var(--bg-base, #0f1220)"/>
    <circle cx="180" cy="140" r="320" fill="url(#ambientWarm)"/>
    <circle cx="430" cy="450" r="260" fill="url(#ambientGreen)"/>

    <!-- the porch light's halo -->
    <circle cx="256" cy="240" r="196" fill="url(#glow)"/>

    <!-- light cone to the ground -->
    <path d="M 210 332 L 142 424 Q 256 458 370 424 L 302 332 Z" fill="url(#cone)"/>

    <!-- "it's on" rays -->
    <g stroke="var(--primary, #ffcf6b)" stroke-width="10" stroke-linecap="round" opacity="0.5">
      <line x1="66"  y1="240" x2="106" y2="240"/>
      <line x1="406" y1="240" x2="446" y2="240"/>
      <line x1="118" y1="108" x2="146" y2="136"/>
      <line x1="366" y1="136" x2="394" y2="108"/>
    </g>

    <!-- the lantern -->
    <g>
      <!-- ceiling mount + rod -->
      <rect x="232" y="46" width="48" height="12" rx="6" fill="var(--border-line, #2a3050)"/>
      <rect x="251" y="54" width="10" height="52" rx="5" fill="var(--border-line, #2a3050)"/>
      <!-- roof -->
      <path d="M 256 96 C 234 102 196 136 189 160 L 323 160 C 316 136 278 102 256 96 Z" fill="var(--border-line, #2a3050)"/>
      <rect x="178" y="156" width="156" height="17" rx="8.5" fill="var(--border-line, #2a3050)"/>
      <!-- glass, lit -->
      <path d="M 201 173 L 311 173 C 317.6 173 322.7 178.8 321.9 185.3 L 306.9 307.3 C 306.2 313.4 301.1 318 295 318 L 217 318 C 210.9 318 205.8 313.4 205.1 307.3 L 190.1 185.3 C 189.3 178.8 194.4 173 201 173 Z" fill="url(#glass)"/>
      <!-- soft core bloom behind the flame -->
      <ellipse cx="256" cy="252" rx="34" ry="46" fill="url(#core)"/>
      <!-- toon flame (rest shape — matches the animated icon's poster frame) -->
      <g>
        <path d="M 256 300 C 228 298 219 270 229 244 C 236 226 248 219 251 199 C 253 190 256 187 256 187 C 256 187 259 190 261 199 C 264 219 276 226 283 244 C 293 270 284 298 256 300 Z" fill="url(#flameBody)"/>
        <path d="M 256 293 C 237 292 230 270 239 249 C 244 234 252 228 254 212 C 255 205 257 205 258 212 C 260 228 268 234 273 249 C 282 270 275 292 256 293 Z" fill="url(#flameCore)"/>
        <path d="M 256 286 C 244 285 240 269 246 253 C 250 241 255 236 256 222 C 257 236 261 241 266 253 C 272 269 268 285 256 286 Z" fill="#fff7df"/>
      </g>
      <!-- paned-glass ribs (follow the taper) -->
      <g stroke="var(--border-line, #2a3050)" stroke-width="8" stroke-linecap="round" opacity="0.85">
        <line x1="238" y1="177" x2="243" y2="314"/>
        <line x1="274" y1="177" x2="269" y2="314"/>
      </g>
      <!-- base + finial -->
      <rect x="194" y="318" width="124" height="23" rx="11.5" fill="var(--border-line, #2a3050)"/>
      <circle cx="256" cy="352" r="9" fill="var(--border-line, #2a3050)"/>
    </g>

    <!-- porch floor -->
    <path d="M 92 424 Q 256 460 420 424" stroke="rgba(233,236,255,0.20)" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- a member coming home, into the light -->
    <circle cx="344" cy="423" r="32" fill="url(#dotGlow)"/>
    <circle cx="344" cy="425" r="13" fill="var(--accent, #69d38a)"/>
    <circle cx="381" cy="426" r="7"  fill="var(--accent, #69d38a)" opacity="0.5"/>
    <circle cx="408" cy="424" r="4.5" fill="var(--accent, #69d38a)" opacity="0.28"/>
  </g>
</svg>
